<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Vocabulary Master — Luyện Gõ Pinyin & Từ Vựng Tiếng Trung</title>
    <!-- Thư viện đọc file Excel SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary-color: #db2777;
            --primary-hover: #be185d;
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #fbcfe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 24px 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px 20px;
            border-radius: 18px;
            box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 800;
        }

        /* Controls Section */
        .controls-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            background: #fff0f5;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px dashed var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4b5563;
        }

        input[type="file"] {
            font-size: 0.85rem;
        }

        input[type="number"], select {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
            background: #fff;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(219, 39, 119, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button.muted {
            background-color: #6b7280;
            box-shadow: none;
        }

        button.muted:hover {
            background-color: #4b5563;
        }

        /* Stats Bar & Timer */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #fdf2f8;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid #fbcfe8;
        }

        .timer-badge {
            background: #db2777;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #10b981;
            transition: width 0.3s ease;
        }

        /* Table Design */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #f3f4f6;
            vertical-align: middle;
        }

        th {
            background-color: #fcf2f6;
            color: #831843;
            font-weight: 700;
            font-size: 0.9rem;
        }

        tr:hover {
            background-color: #fff1f2;
        }

        tr.row-correct {
            background-color: #ecfdf5 !important;
        }

        tr.row-wrong {
            background-color: #fef2f2 !important;
        }

        .col-stt {
            width: 50px;
            font-weight: 600;
            color: #9ca3af;
        }

        .col-hanzi {
            font-size: 1.35rem;
            font-weight: 700;
            color: #111827;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .col-pinyin {
            font-weight: 600;
            color: #4b5563;
        }

        .col-viet {
            font-weight: 500;
        }

        .col-input textarea {
            width: 100%;
            max-width: 220px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            resize: none;
            transition: all 0.2s;
            background: #fafafa;
            font-family: inherit;
        }

        .col-input textarea:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.15);
        }

        .col-input textarea:read-only {
            border-color: #10b981;
            background-color: #ecfdf5;
            color: #047857;
            font-weight: 600;
        }

        .audio-btn {
            background: transparent;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            font-size: 1.1rem;
        }

        .audio-btn:hover {
            background: #fce7f3;
            transform: scale(1.15);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { padding: 10px 6px; }
            .container { padding: 14px 10px; }
            h1 { font-size: 1.3rem; margin-bottom: 14px; }
            .controls-section { flex-direction: column; align-items: stretch; gap: 8px; }
            .control-group { justify-content: space-between; width: 100%; }
            button { width: 100%; padding: 10px; }
            .stats-bar { flex-direction: column; align-items: stretch; text-align: center; gap: 8px; }
            th, td { padding: 8px 4px; font-size: 0.85rem; }
            .col-hanzi { font-size: 1.15rem; }
            .col-input textarea { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HSK Vocabulary Master</h1>

        <!-- Thanh điều khiển -->
        <div class="controls-section">
            <div class="control-group">
                <label for="excelFile">Tải file Excel (.xlsx):</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls">
                <span id="loadingStatus" style="font-size: 0.8rem; color: #db2777;"></span>
            </div>

            <div class="control-group">
                <label for="modeSelect">Chế độ:</label>
                <select id="modeSelect">
                    <option value="chinese_to_viet">Hán Tự ➔ Nghĩa Tiếng Việt</option>
                    <option value="viet_to_chinese">Nghĩa ➔ Gõ Hán Tự / Pinyin</option>
                    <option value="listening_mode">Luyện Nghe (Ẩn cả hai)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="quizSize">Số từ:</label>
                <input type="number" id="quizSize" value="10" min="1" max="100" style="width: 70px;">
            </div>

            <div style="display: flex; gap: 6px; width: 100%; max-width: 320px;">
                <button id="btnNewQuiz" style="flex: 1;">🚀 Tạo bài mới</button>
                <button id="btnReviewWrong" class="muted" style="flex: 1; position: relative;">
                    📖 Ôn từ sai <span id="wrongBadge" style="display:none; background: #ef4444; color:white; padding: 1px 5px; border-radius: 10px; font-size: 0.75rem; position: absolute; top: -6px; right: -6px;">0</span>
                </button>
            </div>
        </div>

        <!-- Thanh thống kê & Đồng hồ -->
        <div class="stats-bar">
            <div>Tổng: <span id="statTotal">0</span> | Đã làm: <span id="statDone">0</span></div>
            <div>Đúng: <span id="statCorrect" style="color: #10b981;">0</span> | Sai: <span id="statWrong" style="color: #ef4444;">0</span> (<span id="statRate">0.0%</span>)</div>
            <div>Thời gian: <span id="timerDisplay" class="timer-badge">00:00</span></div>
            <div style="min-width: 140px; flex-grow: 1; max-width: 220px;">
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>

        <!-- Bảng từ vựng -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 7%;">STT</th>
                        <th style="width: 23%;">Hán Tự / Audio</th>
                        <th style="width: 25%;">Pinyin</th>
                        <th style="width: 25%;">Nghĩa Tiếng Việt</th>
                        <th style="width: 20%;">Nhập đáp án</th>
                    </tr>
                </thead>
                <tbody id="vocabTable">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #9ca3af; padding: 30px;">
                            Vui lòng tải file Excel từ vựng HSK hoặc dùng dữ liệu mặc định để bắt đầu!
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu dự phòng
        const EMBEDDED_VOCAB_DATA = [
            { chinese: "你好", pinyin: "nǐ hǎo", meaning: "xin chào", type: "Từ vựng" },
            { chinese: "谢谢", pinyin: "xiè xie", meaning: "cảm ơn", type: "Từ vựng" },
            { chinese: "再见", pinyin: "zài jiàn", meaning: "tạm biệt", type: "Từ vựng" },
            { chinese: "高兴", pinyin: "gāo xìng", meaning: "vui vẻ, phấn khởi", type: "Từ vựng" },
            { chinese: "学习", pinyin: "xué xí", meaning: "học tập", type: "Từ vựng" }
        ];

        let fullVocabData = [...EMBEDDED_VOCAB_DATA];
        let currentQuizData = [];
        let isTimerRunning = false;
        let secondsElapsed = 0;
        let timerInterval = null;

        // --- Hàm chuẩn hóa chuỗi đơn giản: Chỉ so sánh chữ cái và chữ Hán, bỏ qua dấu câu, khoảng trắng, chữ hoa/thường ---
        function cleanString(str) {
            if (!str) return '';
            return String(str)
                .toLowerCase()
                .replace(/v/g, 'ü')
                .replace(/u:/g, 'ü')
                .replace(/[^a-z0-9āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ\u4e00-\u9fa5]/g, '')
                .trim();
        }

        // Bỏ dấu Pinyin để cho phép gõ không dấu vẫn tính là đúng
        function removePinyinTones(str) {
            if (!str) return '';
            return str
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd').replace(/Đ/g, 'D')
                .replace(/ü/g, 'v')
                .toLowerCase();
        }

        // Chuẩn hóa tiếng Việt (bỏ dấu, bỏ khoảng trắng)
        function normalizeVietnamese(str) {
            if (!str) return '';
            return str
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/đ/g, 'd')
                .replace(/[^a-z0-9]/g, '');
        }

        function fisherYatesShuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- Quản lý Sổ từ sai (LocalStorage) ---
        function getWrongWords() {
            try {
                const stored = localStorage.getItem('wrong_words');
                return stored ? JSON.parse(stored) : [];
            } catch (e) { return []; }
        }

        function saveWrongWord(item) {
            let list = getWrongWords();
            if (!list.some(w => w.chinese === item.chinese)) {
                list.push({ chinese: item.chinese, pinyin: item.pinyin, meaning: item.meaning });
                localStorage.setItem('wrong_words', JSON.stringify(list));
                updateWrongCountBadge();
            }
        }

        function removeWrongWord(item) {
            let list = getWrongWords().filter(w => w.chinese !== item.chinese);
            localStorage.setItem('wrong_words', JSON.stringify(list));
            updateWrongCountBadge();
        }

        function updateWrongCountBadge() {
            const list = getWrongWords();
            const badge = document.getElementById('wrongBadge');
            if (badge) {
                badge.innerText = list.length;
                badge.style.display = list.length > 0 ? 'inline-block' : 'none';
            }
        }

        // --- Text-to-Speech ---
        function speakText(text) {
            if (!text || text === '***') return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Đồng hồ thời gian ---
        function checkAndStartTimer() {
            if (isTimerRunning) return;
            isTimerRunning = true;
            secondsElapsed = 0;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const s = String(secondsElapsed % 60).padStart(2, '0');
                const display = document.getElementById('timerDisplay');
                if (display) display.innerText = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            isTimerRunning = false;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // --- HÀM SO SÁNH ĐÁP ÁN (CHỈ SO SÁNH CHỮ ĐÚNG) ---
        function checkAnswerMatch(userRaw, targetRaw, mode) {
            if (!userRaw) return false;
            const userClean = cleanString(userRaw);
            const targetClean = cleanString(targetRaw);
            if (!userClean || !targetClean) return false;

            if (mode === 'chinese_to_viet') {
                const uNorm = normalizeVietnamese(userRaw);
                const tNorm = normalizeVietnamese(targetRaw);
                if (uNorm === tNorm) return true;

                const tParts = targetRaw.split(/[,;\/]/).map(p => normalizeVietnamese(p)).filter(Boolean);
                const uParts = userRaw.split(/[,;\/]/).map(p => normalizeVietnamese(p)).filter(Boolean);

                for (let up of uParts) {
                    if (tParts.includes(up)) return true;
                    for (let tp of tParts) {
                        if (tp.includes(up) && up.length >= 3) return true;
                        if (up.includes(tp) && tp.length >= 3) return true;
                    }
                }
                return false;
            } else {
                if (userClean === targetClean) return true;

                const uNoTone = removePinyinTones(userClean);
                const tNoTone = removePinyinTones(targetClean);
                if (uNoTone === tNoTone) return true;

                const variants = targetRaw.split(/[,;\/]/).map(v => cleanString(v)).filter(Boolean);
                for (let v of variants) {
                    if (userClean === v || uNoTone === removePinyinTones(v)) return true;
                }
                return false;
            }
        }

        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        // --- XỬ LÝ PHÍM TẮT & TỰ ĐỘNG CHUYỂN CÂU ---
        function handleKeyDown(event, index) {
            checkAndStartTimer();
            const inputElem = document.getElementById(`input_${index}`);
            const mode = document.getElementById('modeSelect').value;

            // Phím Space (khi ô trống) hoặc Control để nghe lại phát âm
            if (event.key === 'Control' || (event.code === 'Space' && inputElem && inputElem.value.trim() === '')) {
                if (event.code === 'Space') event.preventDefault();
                speakText(currentQuizData[index].chinese);
                return;
            }

            // Khi nhấn Enter: Xử lý đáp án và chuyển ngay sang ô tiếp theo
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault(); 
                
                processAnswer(index, inputElem.value);

                const nextIndex = index + 1;
                const nextInput = document.getElementById(`input_${nextIndex}`);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select();
                    if (mode === 'listening_mode' && currentQuizData[nextIndex]) {
                        speakText(currentQuizData[nextIndex].chinese);
                    }
                }
            }
        }

        function processAnswer(index, userVal) {
            const item = currentQuizData[index];
            if (!item) return;

            item.userAnswer = userVal;
            const mode = document.getElementById('modeSelect').value;

            let isCorrect = false;
            if (mode === 'chinese_to_viet') {
                isCorrect = checkAnswerMatch(userVal, item.meaning, 'chinese_to_viet');
            } else {
                const matchPinyin = checkAnswerMatch(userVal, item.pinyin, 'pinyin');
                const matchChinese = checkAnswerMatch(userVal, item.chinese, 'chinese');
                isCorrect = matchPinyin || matchChinese;
            }

            if (isCorrect) {
                item.status = 'correct';
                item.showAnswer = true;
                removeWrongWord(item);
                speakText(item.chinese);
            } else {
                item.status = 'wrong';
                item.showAnswer = true;
                saveWrongWord(item);
            }
            
            updateTableUIOnly();
        }

        // Cập nhật giao diện bảng nhẹ nhàng mà không làm mất focus
        function updateTableUIOnly() {
            const tbody = document.getElementById('vocabTable');
            if (!tbody) return;

            currentQuizData.forEach((item, index) => {
                const tr = tbody.children[index];
                if (!tr) return;

                tr.className = '';
                if (item.status === 'correct') tr.classList.add('row-correct');
                else if (item.status === 'wrong') tr.classList.add('row-wrong');

                const mode = document.getElementById('modeSelect').value;
                const pinyinTd = tr.children[2];
                const vietTd = tr.children[3];
                const textarea = tr.querySelector('textarea');

                if (pinyinTd && (mode === 'chinese_to_viet' || mode === 'listening_mode')) {
                    pinyinTd.innerText = (item.status === 'correct' || item.showAnswer) ? item.pinyin : '•••••';
                }
                if (vietTd && mode !== 'viet_to_chinese') {
                    vietTd.innerText = (item.status === 'correct' || item.showAnswer) ? item.meaning : '•••••';
                }
                if (textarea && item.status === 'correct') {
                    textarea.readOnly = true;
                }
            });

            updateStats();
        }

        // --- Render toàn bộ bảng khi tạo bài mới hoặc đổi chế độ ---
        function renderQuizTable() {
            const tbody = document.getElementById('vocabTable');
            if (!tbody) return;
            tbody.innerHTML = '';

            const mode = document.getElementById('modeSelect').value;

            currentQuizData.forEach((item, index) => {
                const tr = document.createElement('tr');
                if (item.status === 'correct') tr.classList.add('row-correct');
                else if (item.status === 'wrong') tr.classList.add('row-wrong');

                let html = `<td class="col-stt">${index + 1}</td>`;

                // Cột Hán Tự
                if (mode === 'chinese_to_viet') {
                    html += `<td class="col-hanzi">
                        <span>${item.chinese}</span>
                        <button class="audio-btn" onclick="speakText('${item.chinese}')" title="Phát âm">🔊</button>
                    </td>`;
                } else if (mode === 'viet_to_chinese') {
                    html += `<td class="col-hanzi"><span style="color: #9ca3af; font-style: italic;">(Ẩn Hán Tự)</span></td>`;
                } else {
                    html += `<td class="col-hanzi">
                        <button class="audio-btn" style="background: var(--primary-color); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.9rem;" onclick="speakText('${item.chinese}')">🔊 Nghe từ</button>
                    </td>`;
                }

                // Cột Pinyin
                if (mode === 'chinese_to_viet' || mode === 'listening_mode') {
                    const pinyinDisplay = (item.status === 'correct' || item.showAnswer) ? item.pinyin : '•••••';
                    html += `<td class="col-pinyin">${pinyinDisplay}</td>`;
                } else {
                    html += `<td class="col-pinyin">${item.pinyin}</td>`;
                }

                // Cột Nghĩa Tiếng Việt
                if (mode === 'viet_to_chinese') {
                    html += `<td class="col-viet"><span>${item.meaning}</span></td>`;
                } else {
                    const meaningDisplay = (item.status === 'correct' || item.showAnswer) ? item.meaning : '•••••';
                    html += `<td class="col-viet">${meaningDisplay}</td>`;
                }

                // Cột Input
                let placeholder = mode === 'chinese_to_viet' ? "Nhập nghĩa..." : "Gõ Pinyin/Hán tự...";
                const isReadOnly = item.status === 'correct' ? 'readonly' : '';
                const val = item.userAnswer || '';

                html += `<td class="col-input">
                    <textarea rows="1" id="input_${index}" placeholder="${placeholder}" ${isReadOnly}>${val}</textarea>
                </td>`;

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            // Gắn sự kiện cho Textarea
            tbody.querySelectorAll('textarea').forEach((textarea, index) => {
                autoResizeTextarea(textarea);
                textarea.addEventListener('input', function() {
                    autoResizeTextarea(this);
                    checkAndStartTimer();
                });
                textarea.addEventListener('keydown', (e) => handleKeyDown(e, index));
                textarea.addEventListener('blur', function() {
                    if (this.value.trim() !== '') processAnswer(index, this.value);
                });
            });

            updateStats();
        }

        function updateStats() {
            const total = currentQuizData.length;
            let done = 0, correct = 0, wrong = 0;

            currentQuizData.forEach(item => {
                if (item.status === 'correct') { done++; correct++; }
                else if (item.status === 'wrong') { done++; wrong++; }
            });

            const rate = done > 0 ? ((correct / done) * 100).toFixed(1) : '0.0';
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statDone').innerText = done;
            document.getElementById('statCorrect').innerText = correct;
            document.getElementById('statWrong').innerText = wrong;
            document.getElementById('statRate').innerText = rate + '%';
            document.getElementById('progressBar').style.width = percent + '%';

            if (done === total && total > 0) stopTimer();
        }

        // --- Khởi tạo bài học mới ---
        function generateNewQuiz(dataSource = fullVocabData) {
            const size = parseInt(document.getElementById('quizSize').value) || 10;
            let shuffled = fisherYatesShuffle(dataSource);
            currentQuizData = shuffled.slice(0, Math.min(size, shuffled.length)).map(item => ({
                ...item, status: 'unanswered', userAnswer: '', showAnswer: false
            }));

            stopTimer();
            document.getElementById('timerDisplay').innerText = "00:00";
            renderQuizTable();
        }

        // --- Đọc file Excel ---
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loadingStatus').innerText = "Đang đọc file...";
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                    let parsed = [];
                    for (let i = 1; i < json.length; i++) {
                        const row = json[i];
                        if (!row || row.length === 0) continue;
                        let chinese = '', pinyin = '', meaning = '';
                        for (let cell of row) {
                            if (!cell) continue;
                            let str = String(cell).trim();
                            if (/[\u4e00-\u9fa5]/.test(str) && !chinese) chinese = str;
                            else if (/^[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ\s]+$/.test(str) && !pinyin) pinyin = str;
                            else if (!meaning) meaning = str;
                        }
                        if (!chinese && row[0]) chinese = String(row[0]).trim();
                        if (!pinyin && row[1]) pinyin = String(row[1]).trim();
                        if (!meaning && row[2]) meaning = String(row[2]).trim();

                        if (chinese && meaning) {
                            parsed.push({ chinese, pinyin: pinyin || chinese, meaning });
                        }
                    }

                    if (parsed.length > 0) {
                        fullVocabData = parsed;
                        document.getElementById('loadingStatus').innerText = `Đã tải ${parsed.length} từ!`;
                        document.getElementById('quizSize').value = Math.min(20, parsed.length);
                        generateNewQuiz(fullVocabData);
                    } else {
                        document.getElementById('loadingStatus').innerText = "Không đọc được dữ liệu!";
                    }
                } catch(err) {
                    console.error(err);
                    document.getElementById('loadingStatus').innerText = "Lỗi đọc file!";
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Sự kiện các nút
        document.getElementById('btnNewQuiz').addEventListener('click', () => generateNewQuiz(fullVocabData));
        document.getElementById('btnReviewWrong').addEventListener('click', () => {
            const wrongList = getWrongWords();
            if (wrongList.length === 0) {
                alert("Tuyệt vời! Bạn không có từ nào trong sổ từ sai.");
                return;
            }
            generateNewQuiz(wrongList);
        });
        document.getElementById('modeSelect').addEventListener('change', renderQuizTable);

        // Chạy lần đầu
        window.addEventListener('DOMContentLoaded', () => {
            updateWrongCountBadge();
            generateNewQuiz(fullVocabData);
        });
    </script>
</body>
</html>
